<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>EN Gloss Reader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>EN Gloss Reader</h1>

    <div id="error" class="error hidden" role="alert"></div>

    <label class="row">
      <input type="checkbox" id="auto-run" />
      <span>このサイトで自動実行</span>
    </label>
    <p class="hint">対象サイト: <span id="auto-run-host">—</span></p>
    <p class="hint">ON にすると、このサイトを次回開いた時に自動翻訳されます。</p>
    <p class="status-line">
      現在の状態: <span id="auto-run-status" class="status-off">無効</span>
    </p>

    <div class="actions">
      <button type="button" id="run">このページで実行</button>
      <button type="button" id="restore">元に戻す</button>
    </div>

    <hr />

    <p class="info">
      Chrome 140+ デスクトップ版が必要です。ページ本文や翻訳結果は外部サーバに送信しません。
    </p>
    <p>
      <a
        id="privacy-link"
        href="https://enumura1.github.io/furigana-en/privacy.html"
        target="_blank"
        rel="noopener noreferrer"
        >プライバシーポリシー</a
      >
    </p>

    <script src="popup.js"></script>
  </body>
</html>
