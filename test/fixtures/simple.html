      <h1>機械学習の基礎</h1>
      <p>機械学習とは、コンピュータがデータから自動的にパターンを発見し、予測や分類を行う技術の総称である。</p>
      <p>教師あり学習では、入力と正解のペアからモデルを訓練することで、未知のデータに対する予測を可能にする。</p>
      <p>一方、教師なし学習では正解ラベルを必要とせず、データの構造そのものから有用な特徴を抽出する。</p>
      <p>近年では深層学習の発展により、画像認識や自然言語処理の分野で飛躍的な進歩が見られている。</p>
      <p>ただし、モデルの解釈性や公平性、計算資源の消費といった課題も依然として残されている。</p>
